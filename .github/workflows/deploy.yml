name: Deploy Code & Algo Vault to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Securely SSH into AWS and Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          CLERK_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: CLERK_KEY
          script: |
            cd code-algo-vault
            
            # 1. Force the server to exactly match GitHub's main branch
            git fetch --all
            git reset --hard origin/main
            
            # 2. Export the secret for Docker
            export VITE_CLERK_PUBLISHABLE_KEY=$CLERK_KEY
            
            # 3. Shut down current containers
            docker compose down
            
            # 4. Rebuild from absolute scratch (no cache!)
            docker compose build --no-cache
            
            # 5. Start the fresh containers
            docker compose up -d